<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AmiraASTAR</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f2;--surf:#fff;--ink:#16212b;--mut:#5b6a76;--line:#d6dde3;--pri:#1d3b57;--pri-ink:#fff;--acc:#e6a817;--bad:#b3261e;--ok:#1f7a45;--rice:#1f5a3f;--hw:#8a4b12;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e161d;--surf:#16212b;--ink:#e8eef3;--mut:#9aabb8;--line:#2a3a47;--pri:#10253a;--acc:#f0b93a;--bad:#ff8a80;--ok:#6fd49a;--rice:#5bbf8a;--hw:#e0a064}}
:root[data-theme="dark"]{--bg:#0e161d;--surf:#16212b;--ink:#e8eef3;--mut:#9aabb8;--line:#2a3a47;--pri:#10253a;--acc:#f0b93a;--bad:#ff8a80;--ok:#6fd49a;--rice:#5bbf8a;--hw:#e0a064}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;background:var(--pri);color:#fff}
header b{font-size:20px;font-weight:800;letter-spacing:-.3px;flex:1}
header span{opacity:.85;font-size:13px}
header .btn{background:rgba(255,255,255,.18);color:#fff;padding:6px 12px}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--mut);font-weight:600;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{margin:0 0 2px;font-size:18px;font-weight:800}
.mod{border-left:8px solid var(--c);padding:22px}
.mod h3{font-size:26px;letter-spacing:-.5px}
.mod .btn{background:var(--c);color:#fff;margin-top:14px}
.mut{color:var(--mut);font-size:13px}
.chips{display:flex;gap:6px;margin:12px 0}
.chip{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 0;font-weight:600}
.chip.on{background:var(--rice);color:#fff;border-color:var(--rice)}
.chip:disabled{opacity:.35;text-decoration:line-through}
.price{font-size:26px;font-weight:800}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px}
.qty button{background:none;border:0;width:30px;height:32px;font-size:18px}
.qty span{min-width:26px;text-align:center;font-weight:600}
table{width:100%;border-collapse:collapse}
.tw{overflow-x:auto}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--mut);font-weight:600}
td input,td select,.row select{width:90px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
input[type=text],input[type=password],textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin:4px 0 12px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bg);border:1px solid var(--line)}
.badge.placed{border-color:var(--acc)}.badge.delivered{color:var(--ok);border-color:var(--ok)}.badge.cancelled,.badge.low{color:var(--bad);border-color:var(--bad)}
.login{max-width:400px;margin:8vh auto}
.login h1{font-size:34px;font-weight:800;letter-spacing:-1px;margin:0;line-height:1.1}
.demo{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cart{position:sticky;bottom:0;margin-top:16px;background:var(--surf);border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:12px;padding:14px;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:9}
.stat{font-size:28px;font-weight:800}
.err{color:var(--bad);min-height:20px;margin:0 0 8px}
h2{margin:0 0 12px;font-size:22px;font-weight:800}
h4{margin:18px 0 8px;font-size:16px}
.ops{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.ops input{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);width:84px;display:block;margin-top:2px}
.ef{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.ef label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.ef input,.ef select,.ef textarea{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%;margin:0}
.ef .full{grid-column:1/-1}
img.pod{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.mbox{background:var(--surf);border-radius:12px;padding:12px;max-width:min(92vw,720px);max-height:90vh;overflow:auto;text-align:center}
.mbox img{max-width:100%;max-height:75vh;display:block;margin:0 auto 10px}
.badge.submitted{border-color:var(--acc)}.badge.approved{color:var(--ok);border-color:var(--ok)}.badge.paid{color:var(--ok);border-color:var(--ok);font-weight:800}.badge.rejected{color:var(--bad);border-color:var(--bad)}
.shop{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.shop .grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.side{position:sticky;top:12px}
.cartp{background:var(--surf);border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.cartp h3{margin:0;font-size:18px;font-weight:800}
.li{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .nm{font-weight:600}
.li .pr{text-align:right;font-weight:600}
.qty{display:inline-flex}
.cartp label{display:block;font-size:13px;color:var(--mut)}
.cartp textarea,.cartp input[type=text],.cartp select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin:4px 0 0}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding-top:4px}
.cartbar{display:none}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px}
.filters label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.filters input,.filters select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surf);width:auto}
@media(max-width:860px){.shop{grid-template-columns:1fr}.side{position:static}.wrap{padding-bottom:84px}
.cartbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:13px 16px;justify-content:space-between;font-weight:600;z-index:5}}
.mod .btn.alt{background:transparent;color:var(--ink);margin:0}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;padding:0}.sw.on{border-color:var(--ink)}
.dim{opacity:.6}
</style>
</head>
<body>
<div id="app"></div>
<script>
var K='akma_v1',W=[10,20,25],CATS=['Iron & Steel','Cement','Sand & Aggregates','Pipes','Wire'];
var USERS=[{u:'admin',p:'admin123',role:'admin',name:'Meera (Admin)'},{u:'employee',p:'emp123',role:'employee',name:'Ravi (Employee)'},{u:'customer',p:'cust123',role:'customer',name:'Anita (Customer)'}];
function H(id,name,cat,unit,p,s,min){return{id:id,name:name,cat:cat,unit:unit,p:p,s:s,min:min,on:1}}
function seed(){return{next:1001,orders:[],users:[],invites:[],cards:JSON.parse(JSON.stringify(CARDS0)),rice:[
{id:1,name:'Sona Masoori',note:'Everyday medium-grain, soft and light',on:1,v:{10:{p:620,s:50},20:{p:1200,s:30},25:{p:1450,s:40}}},
{id:2,name:'Basmati',note:'Long, aromatic grains for biryani and pulao',on:1,v:{10:{p:1100,s:20},20:{p:2150,s:15},25:{p:2600,s:10}}},
{id:3,name:'Ponni Boiled',note:'Sturdy parboiled rice for daily meals',on:1,v:{10:{p:560,s:40},20:{p:1090,s:25},25:{p:1320,s:30}}},
{id:4,name:'Idli Rice',note:'Short-grain, made for soft idli and dosa',on:1,v:{10:{p:540,s:35},20:{p:1050,s:20},25:{p:1270,s:0}}},
{id:5,name:'Brown Rice',note:'Whole grain with the bran intact',on:1,v:{10:{p:780,s:12},20:{p:1520,s:8},25:{p:1850,s:6}}}],
hw:[H(1,'TMT Bar Fe500D 8 mm','Iron & Steel','12 m rod',322,300,50),H(2,'TMT Bar Fe500D 10 mm','Iron & Steel','12 m rod',503,260,50),H(3,'TMT Bar Fe500D 12 mm','Iron & Steel','12 m rod',725,220,40),H(4,'TMT Bar Fe500D 16 mm','Iron & Steel','12 m rod',1290,120,30),H(5,'MS Angle 40x40x5 mm','Iron & Steel','6 m length',1150,60,15),
H(6,'Cement OPC 53 Grade','Cement','50 kg bag',410,400,80),H(7,'Cement PPC','Cement','50 kg bag',385,520,80),
H(8,'Rasi (river sand)','Sand & Aggregates','tonne',1800,40,10),H(9,'M-Sand','Sand & Aggregates','tonne',1200,60,10),
H(10,'PVC Pipe 1 inch (ISI)','Pipes','6 m length',380,150,30),H(11,'PVC Drainage Pipe 4 inch','Pipes','6 m length',1150,70,15),H(12,'GI Pipe 1 inch (Medium)','Pipes','6 m length',1650,45,12),
H(13,'MS Binding Wire 20 gauge','Wire','kg',78,500,100),H(14,'GI Wire 12 gauge','Wire','kg',95,250,50),H(15,'Welded Wire Mesh 6x3 ft','Wire','sheet',640,8,10)]}}
var CARDS0={rice:{title:'RiceMarket',desc:'Sona Masoori, Basmati and more in 10, 20 and 25 kg bags, priced by variety and weight.',color:'#1f5a3f',on:1},hw:{title:'Hardware Inventory',desc:'Iron, cement, sand, pipes and wire with live stock and low-stock alerts.',color:'#8a4b12',on:1},mt:{title:'Maintenance charges',desc:'Machine repairs and spares, with a spend report.',color:'#6b3fa0',on:1}};
var COLORS=['#1f5a3f','#8a4b12','#1d5fa8','#6b3fa0','#a8321d','#0f766e'];
var db=load()||seed(),me=null,mod=null,tab='',cart=[],sel={},signup=false,edit=false,invMode=false,invPre='',form={addr:'',cn:'',pay:'Pay on delivery'},rep=null,ag=1,ef=null,mf=null,pf=null,mr=null,pt='exp';
if(!db.users)db.users=[];if(!db.invites)db.invites=[];if(!db.spent)db.spent=[];
if(!db.demoUsers){USERS.forEach(function(x){if(!db.users.some(function(y){return y.u===x.u}))db.users.push({u:x.u,p:x.p,role:x.role,name:x.name,email:x.u+'@amiraastar.demo',status:'active'})});db.demoUsers=1;save()}
var hm=(location.hash||'').match(/invite=([A-Za-z0-9_-]+)/);if(hm){invMode=true;invPre=hm[1]}
if(!db.cards)db.cards=JSON.parse(JSON.stringify(CARDS0));
function fixDb(){var N={agencies:[{id:1,name:'Sri Karthikeya Rice Industries',brand:'JPC',on:1}],exp:[],nx:1,maint:[],machines:['Rice mill','Polisher','Sortex machine','Conveyor','Packing machine','Generator','Other'],settings:{vendor:'Regular cover vendor',rate:500}};
  for(var k in N)if(db[k]===undefined)db[k]=N[k];db.rice.forEach(function(r){if(!r.agency)r.agency=1});db.maint.forEach(function(x){if(!x.agency)x.agency=1});if(!db.cards.mt)db.cards.mt=JSON.parse(JSON.stringify(CARDS0.mt));save()}
fixDb();
function staff(){return me.role!=='customer'}
function load(){try{return JSON.parse(localStorage.getItem(K))}catch(e){return null}}
function save(){try{localStorage.setItem(K,JSON.stringify(db));return true}catch(e){if(e&&e.name==='QuotaExceededError')toast('Browser storage is full. Remove old receipts or reset demo data.',4000);return false}}
function $(s){return document.querySelector(s)}
function inr(n){return '₹'+Number(n).toLocaleString('en-IN')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(m,ms){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},ms||2200)}
function find(a,id){return db[a].filter(function(x){return x.id===id})[0]}
function ref(c){if(c.m==='rice'){var r=find('rice',c.id);return{name:r.name,label:c.w+' kg',v:r.v[c.w]}}var h=find('hw',c.id);return{name:h.name,label:h.unit,v:h}}
function tabsFor(){var r=me.role,a=mod==='rice',s=a?'Shop':'Catalog';
  if(mod==='mt')return r==='admin'?['Repairs','Summary']:['Repairs'];
  if(r==='customer')return [s,'My orders'];
  if(r==='employee')return a?['Orders',s,'Stock','My expenses']:['Orders',s,'Inventory'];
  return a?['Orders',s,'Stock & prices','Agencies','Payments','Summary','Users']:['Orders',s,'Inventory','Summary','Users']}
function login(){var u=db.users.filter(function(x){return x.u===$('#u').value.trim().toLowerCase()&&x.p===$('#p').value})[0];
  if(!u){$('#err').textContent='Username or password is incorrect.';return}
  if(u.status==='pending'){$('#err').textContent='Your employee account is waiting for admin approval.';return}me=u;mod=null;cart=[];render()}
function fill(u){var x=USERS.filter(function(a){return a.u===u})[0];$('#u').value=x.u;$('#p').value=x.p}
function setSignup(v){signup=v;render()}
function validEmail(x){return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x)}
function validUser(u){return /^[a-z0-9_.]{3,20}$/.test(u)}
function createAccount(){var n=$('#sn').value.trim(),em=$('#se').value.trim().toLowerCase(),ph=$('#sp').value.trim(),u=$('#su').value.trim().toLowerCase(),p=$('#sw').value,r=$('#sr').value,e=$('#err');
  if(!n||!em||!u||!p){e.textContent='Fill in your name, email, username and password.';return}
  if(!validEmail(em)){e.textContent='Enter a valid email address.';return}
  if(!validUser(u)){e.textContent='Username: 3 to 20 letters, numbers, dot or underscore.';return}
  if(p.length<6){e.textContent='Password must be at least 6 characters.';return}
  if(db.users.some(function(x){return x.u===u})){e.textContent='That username is taken. Try another.';return}
  if(db.users.some(function(x){return x.email===em})){e.textContent='An account with this email already exists.';return}
  var emp=r==='employee',a={u:u,p:p,role:emp?'employee':'customer',name:n,email:em,phone:ph,status:emp?'pending':'active'};db.users.push(a);save();signup=false;
  if(emp){render();toast('Request sent. An admin must approve your employee account before you can sign in.',4500);return}
  me=a;mod=null;cart=[];toast('Account created');render()}
function setInv(v){invMode=v;if(!v)invPre='';render()}
function b64e(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';return JSON.parse(decodeURIComponent(escape(atob(t))))}
function readInvite(x){var iv=db.invites.filter(function(i){return i.code===x.toUpperCase()})[0];
  if(!iv){try{var d=b64d(x);iv={code:d.c,email:String(d.e||'').toLowerCase(),name:d.n||'',role:d.r}}catch(e){return null}}
  if(!iv.code||db.spent.indexOf(iv.code)>-1||!validEmail(iv.email)||['customer','employee','admin'].indexOf(iv.role)<0)return null;
  if(db.users.some(function(u){return u.email===iv.email}))return null;return iv}
function suggestUser(em){var b=em.split('@')[0].toLowerCase().replace(/[^a-z0-9_.]/g,'').slice(0,16);if(b.length<3)b=(b+'user').slice(0,8);var u=b;while(db.users.some(function(x){return x.u===u}))u=b+Math.floor(Math.random()*900+100);return u}
function acceptInvite(){var n=$('#in').value.trim(),u=$('#iu').value.trim().toLowerCase(),p=$('#ip').value,e=$('#err'),iv=readInvite($('#ic').value.trim());
  if(!iv){e.textContent='That invite is not valid or has already been used. Ask your admin for a new invite.';return}
  if(!n||!validUser(u)||p.length<6){e.textContent='Enter your name, a username (3 to 20 letters or numbers) and a password of 6 or more characters.';return}
  if(db.users.some(function(x){return x.u===u})){e.textContent='That username is taken. Try another.';return}
  var a={u:u,p:p,role:iv.role,name:n,email:iv.email,status:'active'};db.users.push(a);db.spent.push(iv.code);db.invites=db.invites.filter(function(x){return x.code!==iv.code});save();
  me=a;mod=null;cart=[];invMode=false;invPre='';try{history.replaceState(null,'',location.pathname+location.search)}catch(x){}toast('Welcome, '+n.split(' ')[0]);render()}
function logout(){me=null;mod=null;render()}
function open_(m){mod=m;tab=tabsFor()[0];rep=null;mr=null;pf=null;render()}
function home(){mod=null;render()}
function go(x){tab=x;if(x==='Summary'){rep=null;mr=null}if(x==='Payments')pf=null;render()}
function render(){var a=$('#app');
  if(!me&&invMode){var iv=invPre?readInvite(invPre):null,bk='<p style="margin:14px 0 0"><button class="btn alt" onclick="setInv(false)">Back to sign in</button></p>';
    if(invPre&&!iv){a.innerHTML='<div class="wrap login"><h1>Invite not valid</h1><div class="card"><p class="mut" style="margin:0">This invite link is invalid, was cancelled, or has already been used. Ask your admin to send a new invite.</p>'+bk+'</div></div>';return}
    if(iv){a.innerHTML='<div class="wrap login"><h1>You are invited</h1><p class="mut">Join AmiraASTAR as '+(iv.role==='admin'?'an admin':'a '+iv.role)+'. Choose a password to finish.</p><div class="card"><div class="mut">Email</div><div style="margin-bottom:12px"><b>'+esc(iv.email)+'</b></div><input type="hidden" id="ic" value="'+esc(invPre)+'"><label>Full name<input type="text" id="in" value="'+esc(iv.name)+'"></label><label>Username<input type="text" id="iu" value="'+esc(suggestUser(iv.email))+'"></label><label>Password<input type="password" id="ip" autocomplete="new-password"></label><p class="err" id="err"></p><button class="btn" style="width:100%" onclick="acceptInvite()">Join AmiraASTAR</button>'+bk+'</div></div>';return}
    a.innerHTML='<div class="wrap login"><h1>Accept your invite</h1><p class="mut">Enter the invite code from your email and set up your sign-in.</p><div class="card"><label>Invite code<input type="text" id="ic"></label><label>Full name<input type="text" id="in"></label><label>Username<input type="text" id="iu" autocomplete="username"></label><label>Password<input type="password" id="ip" autocomplete="new-password"></label><p class="err" id="err"></p><button class="btn" style="width:100%" onclick="acceptInvite()">Join</button>'+bk+'</div></div>';return}
  if(!me&&signup){a.innerHTML='<div class="wrap login"><h1>Create your account</h1><p class="mut">Customers can order right away. Employee accounts are activated once an admin approves them.</p><div class="card"><label>Full name<input type="text" id="sn" autocomplete="name"></label><label>Email<input type="text" id="se" autocomplete="email"></label><label>Phone<input type="text" id="sp" autocomplete="tel"></label><label>I am signing up as<select id="sr" style="width:100%;padding:10px;margin:4px 0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)"><option value="customer">Customer (place orders)</option><option value="employee">Employee (needs admin approval)</option></select></label><label>Username<input type="text" id="su" autocomplete="username"></label><label>Password<input type="password" id="sw" autocomplete="new-password"></label><p class="err" id="err"></p><button class="btn" style="width:100%" onclick="createAccount()">Create account</button><p style="margin:14px 0 0"><button class="btn alt" onclick="setSignup(false)">Back to sign in</button></p></div></div>';return}
  if(!me){a.innerHTML='<div class="wrap login"><h1>AmiraASTAR</h1><p class="mut">Sign in to open your marketplaces and inventory.</p><div class="card"><label>Username<input type="text" id="u" autocomplete="username"></label><label>Password<input type="password" id="p" autocomplete="current-password"></label><p class="err" id="err"></p><button class="btn" style="width:100%" onclick="login()">Sign in</button><p class="mut" style="margin:14px 0 0">Demo accounts (tap to fill):</p><div class="demo"><button class="btn alt" onclick="fill(\'admin\')">Admin</button><button class="btn alt" onclick="fill(\'employee\')">Employee</button><button class="btn alt" onclick="fill(\'customer\')">Customer</button></div><p class="mut" style="margin:16px 0 6px">New here?</p><button class="btn alt" onclick="setSignup(true)">Create account</button> <button class="btn alt" onclick="setInv(true)">I have an invite</button></div></div>';
    $('#p').addEventListener('keydown',function(e){if(e.key==='Enter')login()});return}

  if(ks.length){var T={submitted:0,approved:0,paid:0,rejected:0};h+='<div class="card tw" style="margin-bottom:14px"><table><tr><th>Employee</th><th>Waiting review</th><th>Approved, to pay</th><th>Paid</th><th>Rejected</th></tr>';
    ks.forEach(function(k){var r=by[k];h+='<tr><td><b>'+esc(r.n)+'</b></td><td>'+inr(r.submitted)+'</td><td>'+inr(r.approved)+'</td><td>'+inr(r.paid)+'</td><td>'+inr(r.rejected)+'</td></tr>';ST.forEach(function(s){T[s]+=r[s]})});
    h+='<tr><td><b>Total</b></td><td><b>'+inr(T.submitted)+'</b></td><td><b>'+inr(T.approved)+'</b></td><td><b>'+inr(T.paid)+'</b></td><td><b>'+inr(T.rejected)+'</b></td></tr></table></div>'}
  if(!list.length)return h+'<div class="card"><b>No expenses match these filters</b><p class="mut" style="margin:4px 0 0">Widen the date range, or choose All to see every status.</p></div>';
  h+='<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">';list.forEach(function(x){h+=expCard(x,true)});return h+'</div>'}
/* ---- maintenance ---- */
function getMf(){if(!mf)mf={date:dstr(new Date()),machine:db.machines[0]||'',desc:'',vendor:'',amount:'',pod:''};return mf}
function setMf(k,v){getMf()[k]=v}
function addMaint(){var M=getMf(),a=parseFloat(M.amount);
  if(!M.machine){toast('Choose the machine');return}if(!M.desc.trim()){toast('Describe the repair');return}if(!(a>0)){toast('Enter the amount spent');return}
  db.maint.unshift({id:db.nx++,agency:ag,date:M.date||dstr(new Date()),machine:M.machine,desc:M.desc.trim(),vendor:M.vendor.trim(),amount:Math.round(a*100)/100,pod:M.pod,by:me.u,byName:me.name,ts:Date.now()});
  if(!save()){db.maint.shift();return}mf=null;toast('Repair logged');render()}
function delMaint(id){db.maint=db.maint.filter(function(x){return x.id!==id});save();render()}
function addMachine(){var n=$('#mn').value.trim();if(!n){toast('Enter the machine name');return}if(db.machines.indexOf(n)>-1){toast('That machine is already listed');return}db.machines.push(n);save();toast('Machine added');render()}
function repairs(){var M=getMf(),adm=me.role==='admin',l=db.maint.filter(function(x){return adm||x.by===me.u}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.ts-a.ts}),
  h='<h2>Machine repairs</h2><div class="card" style="margin-bottom:14px"><b>Log a repair</b><div class="ef" style="margin-top:10px"><label>Date<input type="date" value="'+M.date+'" onchange="setMf(\'date\',this.value)"></label><label>Machine<select onchange="setMf(\'machine\',this.value)">'+db.machines.map(function(m){return '<option'+(m===M.machine?' selected':'')+'>'+esc(m)+'</option>'}).join('')+'</select></label><label>Amount (₹)<input type="number" min="0" value="'+esc(M.amount)+'" oninput="setMf(\'amount\',this.value)"></label><label>Mechanic or shop<input type="text" value="'+esc(M.vendor)+'" oninput="setMf(\'vendor\',this.value)"></label><label class="full">What was repaired?<textarea rows="2" placeholder="For example: belt replaced, bearing changed" oninput="setMf(\'desc\',this.value)">'+esc(M.desc)+'</textarea></label>'+podField('mf',false)+'</div><button class="btn" style="margin-top:12px" onclick="addMaint()">Save repair</button></div>';
  if(adm)h+='<div class="card" style="margin-bottom:14px"><b>Add a machine</b><div class="row" style="margin-top:8px;flex-wrap:wrap"><input type="text" id="mn" placeholder="Machine name" style="flex:1;margin:0"><button class="btn alt" onclick="addMachine()">Add machine</button></div></div>';
  if(!l.length)return h+'<div class="card"><b>No repairs logged yet</b><p class="mut" style="margin:4px 0 0">Repair costs you save here feed the maintenance report.</p></div>';
  h+='<div class="card tw"><table><tr><th>Date</th><th>Machine</th><th>Repair</th><th>Mechanic or shop</th><th>By</th><th>Bill</th><th style="text-align:right">Amount</th>'+(adm?'<th></th>':'')+'</tr>';
  l.forEach(function(x){h+='<tr><td>'+x.date+'</td><td>'+esc(x.machine)+'</td><td>'+esc(x.desc)+'</td><td>'+esc(x.vendor||'-')+'</td><td>'+esc(x.byName)+'</td><td>'+(x.pod?'<img class="pod" style="width:44px;height:44px" src="'+x.pod+'" onclick="viewPod(\'maint\','+x.id+')" alt="Bill">':'-')+'</td><td style="text-align:right">'+inr(x.amount)+'</td>'+(adm?'<td><button class="btn alt" onclick="delMaint('+x.id+')">Delete</button></td>':'')+'</tr>'});
  return h+'</table></div>'}
function setMr(k,v){if(!v&&(k==='from'||k==='to'))v=dstr(new Date());mr[k]=v;render()}
function mtReport(){var td=dstr(new Date());if(!mr)mr={from:td,to:td,machine:'all'};
  var lo=mr.from<=mr.to?mr.from:mr.to,hi=mr.from<=mr.to?mr.to:mr.from,
  list=db.maint.filter(function(x){return x.date>=lo&&x.date<=hi&&(mr.machine==='all'||x.machine===mr.machine)}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.ts-a.ts}),
  tot=list.reduce(function(a,x){return a+x.amount},0),by={};list.forEach(function(x){by[x.machine]=(by[x.machine]||0)+x.amount});
  var ks=Object.keys(by).sort(function(a,b){return by[b]-by[a]}),
  h='<h2>Maintenance report</h2><div class="filters"><label>From<input type="date" value="'+mr.from+'" onchange="setMr(\'from\',this.value)"></label><label>To<input type="date" value="'+mr.to+'" onchange="setMr(\'to\',this.value)"></label><label>Machine<select onchange="setMr(\'machine\',this.value)"><option value="all">All machines</option>'+db.machines.map(function(m){return '<option'+(m===mr.machine?' selected':'')+'>'+esc(m)+'</option>'}).join('')+'</select></label><button class="btn alt" onclick="mr=null;render()">Today</button></div>';
  h+='<div class="grid" style="margin-bottom:14px"><div class="card"><div class="mut">Spent on repairs</div><div class="stat">'+inr(tot)+'</div></div><div class="card"><div class="mut">Repairs logged</div><div class="stat">'+list.length+'</div></div><div class="card"><div class="mut">Highest spend</div><div class="stat" style="font-size:20px">'+(ks[0]?esc(ks[0]):'None yet')+'</div></div></div>';
  if(!list.length)return h+'<div class="card"><b>No repairs in this period</b><p class="mut" style="margin:4px 0 0">Widen the date range or choose All machines.</p></div>';
  h+='<div class="card tw" style="margin-bottom:14px"><table><tr><th>Machine</th><th style="text-align:right">Spent</th></tr>';ks.forEach(function(k){h+='<tr><td>'+esc(k)+'</td><td style="text-align:right">'+inr(by[k])+'</td></tr>'});
  h+='</table></div><div class="card tw"><table><tr><th>Date</th><th>Machine</th><th>Repair</th><th>Mechanic or shop</th><th>By</th><th style="text-align:right">Amount</th></tr>';
  list.forEach(function(x){h+='<tr><td>'+x.date+'</td><td>'+esc(x.machine)+'</td><td>'+esc(x.desc)+'</td><td>'+esc(x.vendor||'-')+'</td><td>'+esc(x.byName)+'</td><td style="text-align:right">'+inr(x.amount)+'</td></tr>'});
  return h+'</table></div>'}

/* ---- payments: sections + maintenance charges per agency ---- */
function setPt(v){pt=v;render()}
function payTabs(){return '<div class="chips" style="flex-wrap:wrap;margin:0 0 14px">'+[['exp','Employee expenses'],['mt','Maintenance charges']].map(function(x){return '<button class="chip'+(pt===x[0]?' on':'')+'" style="flex:0 0 auto;padding:8px 16px" aria-pressed="'+(pt===x[0])+'" onclick="setPt(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')+'</div>'}
function payments(){return payTabs()+(pt==='mt'?maintTab():expPayments())}
function maintTab(){var td=dstr(new Date());
  if(!db.agencies.length)return '<h2>Maintenance charges</h2>'+agBar();
  if(!mr)mr={from:td.slice(0,8)+'01',to:td,machine:'all'};
  var M=getMf(),A=find('agencies',ag)||db.agencies[0],
  lo=mr.from<=mr.to?mr.from:mr.to,hi=mr.from<=mr.to?mr.to:mr.from,
  inR=db.maint.filter(function(x){return x.date>=lo&&x.date<=hi&&(mr.machine==='all'||x.machine===mr.machine)}),
  mine=inR.filter(function(x){return x.agency===ag}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.ts-a.ts}),
  tot=mine.reduce(function(a,x){return a+x.amount},0),by={};mine.forEach(function(x){by[x.machine]=(by[x.machine]||0)+x.amount});
  var ks=Object.keys(by).sort(function(a,b){return by[b]-by[a]}),
  h='<h2>Maintenance charges</h2><p class="mut">Repairs and spares are tracked separately for each agency. Pick an agency to log and view its charges.</p>'+agBar();
  h+='<div class="card" style="margin-bottom:14px"><b>Log a maintenance charge for '+esc(A.name)+'</b><div class="ef" style="margin-top:10px"><label>Date<input type="date" value="'+M.date+'" onchange="setMf(\'date\',this.value)"></label><label>Machine<select onchange="setMf(\'machine\',this.value)">'+db.machines.map(function(m){return '<option'+(m===M.machine?' selected':'')+'>'+esc(m)+'</option>'}).join('')+'</select></label><label>Amount (₹)<input type="number" min="0" value="'+esc(M.amount)+'" oninput="setMf(\'amount\',this.value)"></label><label>Mechanic or shop<input type="text" value="'+esc(M.vendor)+'" oninput="setMf(\'vendor\',this.value)"></label><label class="full">What was repaired?<textarea rows="2" placeholder="For example: belt replaced, bearing changed" oninput="setMf(\'desc\',this.value)">'+esc(M.desc)+'</textarea></label>'+podField('mf',false)+'</div><button class="btn" style="margin-top:12px" onclick="addMaint()">Save charge for '+esc(A.name)+'</button></div>';
  h+='<div class="card" style="margin-bottom:14px"><b>Add a machine</b><div class="row" style="margin-top:8px;flex-wrap:wrap"><input type="text" id="mn" placeholder="Machine name" style="flex:1;margin:0"><button class="btn alt" onclick="addMachine()">Add machine</button></div></div>';
  h+='<div class="filters"><label>From<input type="date" value="'+mr.from+'" onchange="setMr(\'from\',this.value)"></label><label>To<input type="date" value="'+mr.to+'" onchange="setMr(\'to\',this.value)"></label><label>Machine<select onchange="setMr(\'machine\',this.value)"><option value="all">All machines</option>'+db.machines.map(function(m){return '<option'+(m===mr.machine?' selected':'')+'>'+esc(m)+'</option>'}).join('')+'</select></label><button class="btn alt" onclick="mr=null;render()">This month</button></div>';
  h+='<div class="card tw" style="margin-bottom:14px"><b>All agencies, same period</b><table><tr><th>Agency</th><th>Charges</th><th style="text-align:right">Total</th></tr>';
  var gt=0,gn=0;db.agencies.forEach(function(a){var l=inR.filter(function(x){return x.agency===a.id}),t=l.reduce(function(s,x){return s+x.amount},0);gt+=t;gn+=l.length;h+='<tr'+(a.id===ag?' style="background:var(--bg)"':'')+'><td>'+(a.id===ag?'<b>':'')+esc(a.name)+(a.brand?' ('+esc(a.brand)+')':'')+(a.id===ag?'</b>':'')+'</td><td>'+l.length+'</td><td style="text-align:right">'+inr(t)+'</td></tr>'});
  h+='<tr><td><b>Total</b></td><td><b>'+gn+'</b></td><td style="text-align:right"><b>'+inr(gt)+'</b></td></tr></table></div>';
  h+='<div class="grid" style="margin-bottom:14px"><div class="card"><div class="mut">'+esc(A.name)+': maintenance spend</div><div class="stat">'+inr(tot)+'</div></div><div class="card"><div class="mut">Charges logged</div><div class="stat">'+mine.length+'</div></div><div class="card"><div class="mut">Highest spend</div><div class="stat" style="font-size:20px">'+(ks[0]?esc(ks[0]):'None yet')+'</div></div></div>';
  if(!mine.length)return h+'<div class="card"><b>No maintenance charges for '+esc(A.name)+' in this period</b><p class="mut" style="margin:4px 0 0">Log one above, widen the date range, or choose All machines.</p></div>';
  h+='<div class="card tw"><table><tr><th>Date</th><th>Machine</th><th>Repair</th><th>Mechanic or shop</th><th>By</th><th>Bill</th><th style="text-align:right">Amount</th><th></th></tr>';
  mine.forEach(function(x){h+='<tr><td>'+x.date+'</td><td>'+esc(x.machine)+'</td><td>'+esc(x.desc)+'</td><td>'+esc(x.vendor||'-')+'</td><td>'+esc(x.byName)+'</td><td>'+(x.pod?'<img class="pod" style="width:44px;height:44px" src="'+x.pod+'" onclick="viewPod(\'maint\','+x.id+')" alt="Bill">':'-')+'</td><td style="text-align:right">'+inr(x.amount)+'</td><td><button class="btn alt" onclick="delMaint('+x.id+')">Delete</button></td></tr>'});
  return h+'</table></div>'}

/* ---- admin: record an employee payment/expense ---- */
function staffUsers(){return db.users.filter(function(u){return u.role!=='customer'&&u.status!=='pending'&&u.status!=='disabled'})}
function submitAdminExp(){var E=getEf(),a=parseFloat(E.amount),us=staffUsers(),u=us.filter(function(x){return x.u===(E.emp||(us[0]&&us[0].u))})[0];
  if(!u){toast('Choose the employee');return}
  if(!(a>0)){toast('Enter the amount');return}
  if(!E.details.trim()){toast('Add details of what this was for');return}
  if(E.cat==='Covers'&&!(parseInt(E.qty,10)>0)){toast('Enter how many covers');return}
  var d=E.date||dstr(new Date()),st=E.st||'approved',x={id:db.nx++,date:d,emp:u.u,empName:u.name,cat:E.cat,amount:Math.round(a*100)/100,vendor:E.vendor.trim(),qty:parseInt(E.qty,10)||0,details:E.details.trim(),order:E.order?+E.order:null,pod:E.pod,status:st,note:'',addedBy:me.name,ts:Date.now()};
  if(st!=='submitted')x.reviewer=me.name;if(st==='paid')x.paidOn=d;
  db.exp.unshift(x);if(!save()){db.exp.shift();return}
  var keep=E.emp;ef=null;getEf().emp=keep;toast('Payment record added');render()}
function expPayments(){var E=getEf(),us=staffUsers(),cur=E.emp||(us[0]&&us[0].u)||'',
  ords=db.orders.filter(function(o){return o.mod==='rice'&&o.status!=='cancelled'}).slice(0,40),
  h='<div class="card" style="margin-bottom:14px"><b>Add a payment record</b><p class="mut" style="margin:4px 0 12px">Record petrol, food, covers or other money paid to or spent by an employee. Employees can also add their own under My expenses.</p><div class="ef">'
  +'<label>Employee<select onchange="setEf(\'emp\',this.value)">'+us.map(function(u){return '<option value="'+esc(u.u)+'"'+(u.u===cur?' selected':'')+'>'+esc(u.name)+'</option>'}).join('')+'</select></label>'
  +'<label>Date<input type="date" value="'+E.date+'" onchange="setEf(\'date\',this.value)"></label>'
  +'<label>Category<select onchange="efCat(this.value)">'+ECATS.map(function(c){return '<option'+(c===E.cat?' selected':'')+'>'+c+'</option>'}).join('')+'</select></label>'
  +'<label>Amount (₹)<input type="number" min="0" value="'+esc(E.amount)+'" oninput="setEf(\'amount\',this.value)"></label>'
  +'<label>Paid to<input type="text" value="'+esc(E.vendor)+'" placeholder="Shop, vendor or station" oninput="setEf(\'vendor\',this.value)"></label>'
  +'<label>Order (optional)<select onchange="efOrder(this.value)"><option value="">Not for one order</option>'+ords.map(function(o){return '<option value="'+o.id+'"'+(String(o.id)===String(E.order)?' selected':'')+'>#'+o.id+' · '+esc(o.custName)+' · '+bagsOf(o.id)+' bags</option>'}).join('')+'</select></label>'
  +'<label>Record as<select onchange="setEf(\'st\',this.value)">'+[['submitted','Waiting review'],['approved','Approved, to pay'],['paid','Already paid']].map(function(x){return '<option value="'+x[0]+'"'+(x[0]===E.st?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select></label>'
  +(E.cat==='Covers'?'<label>Number of covers<input type="number" min="0" value="'+esc(E.qty)+'" oninput="setEf(\'qty\',this.value)"></label>':'')
  +'<label class="full">Details<textarea rows="2" placeholder="What was this for?" oninput="setEf(\'details\',this.value)">'+esc(E.details)+'</textarea></label>'+podField('ef',false)+'</div><button class="btn" style="margin-top:12px" onclick="submitAdminExp()">Save payment record</button></div>';
  return h+expList()}

render();
</script>
